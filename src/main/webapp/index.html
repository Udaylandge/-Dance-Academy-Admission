<html>
<head>
    <title>Dance Academy Admission</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
<div class="container">
    <h1>Dance Academy Admission</h1>
    <form action="result.jsp" method="post" onsubmit="return validateForm()">
        <label>Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <label>Dance Style</label>
        <select id="style" name="style">
            <option value="">Select Style</option>
            <option value="Classical">Classical</option>
            <option value="Hip-Hop">Hip-Hop</option>
            <option value="Folk">Folk</option>
            <option value="Zumba">Zumba</option>
        </select>
        <label>Level</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="level" value="Beginner">Beginner</label>
            <label>
                <input type="radio" name="level" value="Advanced">Advanced</label>
        </div>
        <label>Monthly Fee</label>
        <input type="number" id="monthly_fee" name="monthly_fee"
               placeholder="Enter monthly fee">
        <button type="submit">Save Admission</button>
    </form>
</div>
</body>
</html>
